# Pasa los tests (python -m unittest) en cada push y en cada pull request.
# Las acciones van fijadas por el SHA de su commit (no por la etiqueta, que se puede mover); el comentario dice
# qué versión es. Para actualizarlas: git ls-remote --tags https://github.com/actions/checkout
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m unittest
