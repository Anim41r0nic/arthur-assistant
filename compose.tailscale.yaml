# Opcional (lo añade el instalador a COMPOSE_FILE si el servidor tiene Tailscale): ARTHUR también en la IP de
# Tailscale del servidor, para que tus aparatos (portátil, Windows…) le hablen por la red privada. Ni la red de
# casa ni internet lo ven.
services:
  core:
    ports:
      - "${ARTHUR_TAILSCALE_IP:?falta ARTHUR_TAILSCALE_IP en .env}:8770:8770"
  # Las páginas de los servicios opcionales (solo si su perfil está activo). El chat de la web y el cerebro, nunca.
  apuntes-web:
    ports:
      - "${ARTHUR_TAILSCALE_IP:?falta ARTHUR_TAILSCALE_IP en .env}:8774:8774"
  panel-web:
    ports:
      - "${ARTHUR_TAILSCALE_IP:?falta ARTHUR_TAILSCALE_IP en .env}:8775:8775"
  clientes:
    ports:
      - "${ARTHUR_TAILSCALE_IP:?falta ARTHUR_TAILSCALE_IP en .env}:8777:8777"
